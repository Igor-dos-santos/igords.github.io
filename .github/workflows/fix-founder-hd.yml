name: Restore full-size founder portrait
on:
  push:
    paths: ['caju-clover-preview/photo-repair-trigger.txt']
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - run: python -m pip install --quiet Pillow
      - name: Try image source
        env:
          SOURCE_URLS: "https://media.canva.com/ifs/M/551c5616-7fcc-4bd5-8c45-2c7172439ab1||https://media.canva.com/ifs/M/551c5616-7fcc-4bd5-8c45-2c7172439ab1.jpg||https://media.canva.com/v2/image-resize/format:JPG/height:1448/quality:85/uri:ifs%3A%2F%2FM%2F551c5616-7fcc-4bd5-8c45-2c7172439ab1/watermark:F/width:1086"
        run: |
          python - <<'PY'
          import os,requests,io
          from PIL import Image
          for i,url in enumerate(os.environ['SOURCE_URLS'].split('||')):
            try:
              r=requests.get(url,timeout=12)
              print('Try',i,'status',r.status_code,'bytes',len(r.content),'type',r.headers.get('Content-Type'))
              if r.status_code!=200:continue
              im=Image.open(io.BytesIO(r.content));print('Dimensions',im.size)
              if im.width>=600 and im.height>=800:
                im=im.convert('RGB');im.save('caju-clover-preview/assets/founder-igor-hd.webp',format='WEBP',quality=84,method=6);break
            except Exception as e: print('Error',i,str(e)[:170])
          else:raise SystemExit('No full-size version available')
          PY
      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caju-clover-preview/assets/founder-igor-hd.webp
          git commit -m "Restore high-resolution founder portrait" || exit 0
          git push origin HEAD:master
